[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "energy-modeling-kapelbok"
version = "0.1.0"
description = "Hourly energy forecasting workflow using baseline, linear, and structural time series models."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "pandas>=2.0.0",
  "numpy>=1.24.0",
  "openpyxl>=3.1.0",
  "scikit-learn>=1.3.0",
  "statsmodels>=0.14.0",
  "matplotlib>=3.7.0",
  "PyYAML>=6.0",
  "joblib>=1.3.0",
  "streamlit>=1.25.0"
]

[project.scripts]
energy-forecast = "energy_modeling.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
